<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="screen-body">
    <div class="detail-hero">
      <div class="detail-circle" style="color:var(--note)">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </div>
    </div>

    <h1 class="detail-heading">Note</h1>
    <div class="detail-last">Last: Never</div>

    <div class="card">
      <div class="field">
        <div class="label-caps">Note</div>
        <textarea class="textarea" placeholder="Write a note"></textarea>
      </div>
    </div>
  </div>

  <div class="screen-footer">
    <a class="btn btn-primary is-disabled" href="home.html">
      Save
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
