<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="page-title">Account</div>

  <div class="screen-body" style="padding-top:8px">
    <div class="card profile-card">
      <span class="avatar">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
      </span>
      <span class="profile-main">
        <span class="profile-name">Amara</span>
        <span class="profile-phone">+94 70 000 0001</span>
      </span>
      <button class="icon-btn" type="button" data-menu-toggle aria-label="Account options" style="margin:0">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>

      <div class="menu" data-menu hidden>
        <a class="menu-item" href="profile.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          Edit profile
        </a>
        <a class="menu-item danger" href="language.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
          Sign out
        </a>
      </div>
    </div>

    <div class="section-label">Babies</div>
    <div class="vax-group">
      <div class="baby-row">
        <span class="baby-avatar" style="background:#cfe3f7;color:#2f7cc4">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><circle cx="12" cy="12" r="9"/></svg>
        </span>
        <span class="baby-main">
          <span class="baby-name">Aaron</span>
          <span class="baby-sub">Boy · Day 10</span>
        </span>
        <a class="icon-btn" href="add-baby.html" aria-label="Edit Aaron" style="margin:0;color:var(--primary)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </a>
      </div>
      <div class="baby-row">
        <span class="baby-avatar" style="background:#fbdcea;color:#cc4a85">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><circle cx="12" cy="12" r="9"/><path d="M5 8c2-2 5-3 7-3s5 1 7 3"/></svg>
        </span>
        <span class="baby-main">
          <span class="baby-name">Nethmi</span>
          <span class="baby-sub">Girl · 2y 3m</span>
        </span>
        <a class="icon-btn" href="add-baby.html" aria-label="Edit Nethmi" style="margin:0;color:var(--primary)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </a>
      </div>
      <a class="baby-row add" href="add-baby.html">
        <span class="baby-avatar" style="background:var(--surface-container);color:var(--on-surface-variant)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </span>
        <span class="baby-main">
          <span class="baby-name">Add another baby</span>
        </span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--outline-variant)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>

    <p class="mock-note">Static mockup for review — data shown is sample content.</p>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg>
      Today
    </a>
    <a class="nav-item" href="development.html">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5.5L12 2.5 4 5.5V12c0 6 8 10 8 10z"/></svg>
      Development
    </a>
    <a class="nav-item is-active" href="account.html">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
      Account
    </a>
  </nav>

  <div class="menu-scrim" data-menu-scrim hidden></div>
</div>
<script src="../assets/interactions.js" defer></script>
</body>
</html>
