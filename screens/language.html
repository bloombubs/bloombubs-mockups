<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="screen-body" style="padding-top:28px">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></svg>
      </div>
      <div class="brand-name">Bloombubs</div>
    </div>

    <h1 class="headline" style="text-align:center;margin-top:24px">Welcome to Bloombubs</h1>
    <p class="body-lg" style="text-align:center">
      Choose your language<br>
      ඔබේ භාෂාව තෝරන්න<br>
      உங்கள் மொழியைத் தேர்ந்தெடுக்கவும்
    </p>

    <div class="lang-list">
      <a class="lang-option is-selected" href="phone.html">
        <div>
          <div class="lang-native">English</div>
          <div class="lang-english">English</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="lang-option" href="phone.html">
        <div>
          <div class="lang-native">සිංහල</div>
          <div class="lang-english">Sinhala</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="lang-option" href="phone.html">
        <div>
          <div class="lang-native">தமிழ்</div>
          <div class="lang-english">Tamil</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
  </div>

  <div class="screen-footer">
    <a class="btn btn-primary" href="phone.html">
      Continue
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
</body>
</html>
