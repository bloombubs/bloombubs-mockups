<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone number — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" href="language.html" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="screen-body">
    <div class="brand-mark" style="width:56px;height:56px;border-radius:16px">
      <img class="logo-img" src="../assets/logo.png" width="50" height="50" alt="Bloombubs">
    </div>

    <h1 class="headline" style="margin-top:24px">Enter your phone number</h1>
    <p class="body-md" style="font-size:17px;margin-top:12px">We'll send a verification code to this number on WhatsApp.</p>

    <div style="margin-top:32px">
      <div class="label-caps">Phone number</div>
      <div class="phone-input">
        <div class="phone-code">+94</div>
        <input class="phone-number" type="tel" value="70 000 0001" aria-label="Phone number">
      </div>
    </div>
  </div>

  <div class="screen-footer">
    <a class="btn btn-primary" href="profile.html">
      Continue
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
<script src="../assets/interactions.js" defer></script>
</body>
</html>
