<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottle feed — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="screen-body">
    <div class="detail-hero">
      <div class="detail-circle" style="color:var(--bottle)">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4"/><path d="M11 5h2v2.5l2.2 2.2a3 3 0 0 1 .8 2V19a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3V11.7a3 3 0 0 1 .8-2L11 7.5z"/><path d="M8.2 13h7.6"/></svg>
      </div>
    </div>

    <h1 class="detail-heading">Bottle feed</h1>
    <div class="detail-last">Last: 8h 1m ago</div>

    <div class="card">
      <div class="label-caps">Amount (ml)</div>
      <div class="stepper">
        <button class="step-btn" style="background:var(--bottle)">−</button>
        <div class="step-value">
          <span class="step-number">0</span>
          <span class="step-unit">ml</span>
        </div>
        <button class="step-btn" style="background:var(--bottle)">+</button>
      </div>

      <div class="label-caps" style="margin-top:22px">Contents · optional</div>
      <div class="pill-row" style="margin-top:10px">
        <button class="pill">Formula</button>
        <button class="pill">Breast milk</button>
      </div>
    </div>
  </div>

  <div class="screen-footer">
    <a class="btn btn-primary is-disabled" href="home.html">
      Save
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
<script src="../assets/interactions.js" defer></script>
</body>
</html>
