<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn" href="home.html" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="screen-body">
    <div class="detail-hero">
      <div class="detail-circle" style="color:var(--growth)">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2.5 21.5 8.5 8.5 21.5 2.5 15.5z"/><path d="m13 5 2 2"/><path d="m10 8 2 2"/><path d="m7 11 2 2"/></svg>
      </div>
    </div>

    <h1 class="detail-heading">Growth</h1>
    <div class="detail-last">Last: 8h 2m ago</div>

    <div class="card">
      <div class="field">
        <div class="label-caps">Date</div>
        <input class="input" type="text" value="Aug 16, 2026">
      </div>
      <div class="field">
        <div class="label-caps">Weight (g)</div>
        <input class="input" type="text" placeholder="e.g. 5200">
      </div>
      <div class="field">
        <div class="label-caps">Height (cm)</div>
        <input class="input" type="text" placeholder="e.g. 58">
      </div>
      <div class="field">
        <div class="label-caps">Head circumference (cm)</div>
        <input class="input" type="text" placeholder="e.g. 39">
      </div>
    </div>
  </div>

  <div class="screen-footer">
    <a class="btn btn-primary is-disabled" href="home.html">
      Save
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>
</div>
</body>
</html>
