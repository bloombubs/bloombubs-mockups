<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth chart — Bloombubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div class="screen" style="position:relative">
  <div class="topbar">
    <a class="icon-btn" href="development.html" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </div>

  <div class="screen-body" style="padding-bottom:100px">
    <div class="metric-row three">
      <div class="card metric-card is-active" data-metric="weight">
        <div class="label-caps">Weight</div>
        <div class="metric-value">4.8 <span class="metric-unit">kg</span></div>
      </div>
      <div class="card metric-card" data-metric="height">
        <div class="label-caps">Height</div>
        <div class="metric-value">58 <span class="metric-unit">cm</span></div>
      </div>
      <div class="card metric-card" data-metric="head">
        <div class="label-caps">Head</div>
        <div class="metric-value">39 <span class="metric-unit">cm</span></div>
      </div>
    </div>

    <div class="segmented">
      <button class="segment is-active" data-panel="weight">Weight</button>
      <button class="segment" data-panel="height">Height</button>
      <button class="segment" data-panel="head">Head</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-head-title">Growth Curve</span>
        <span class="card-head-note">WHO + SL Standard</span>
      </div>

      <div data-panel="weight"><div data-chart="weight"></div></div>
      <div data-panel="height" class="is-hidden"><div data-chart="height"></div></div>
      <div data-panel="head" class="is-hidden"><div data-chart="head"></div></div>

      <div class="chart-legend">
        <span class="legend-item"><i style="background:#e7e1f2"></i>High</span>
        <span class="legend-item"><i style="background:#cfe8ca"></i>Normal</span>
        <span class="legend-item"><i style="background:#edf7ea"></i>At risk</span>
        <span class="legend-item"><i style="background:#f8d5a6"></i>Moderately low</span>
        <span class="legend-item"><i style="background:#f7bdb9"></i>Severely low</span>
      </div>
    </div>

    <p class="mock-note">Static mockup for review — data shown is sample content.</p>
  </div>

  <a class="fab" href="log-growth.html" aria-label="Add growth record" style="bottom:32px">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </a>
</div>
<script src="../assets/charts.js" defer></script>
<script src="../assets/interactions.js" defer></script>
</body>
</html>
